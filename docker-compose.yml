services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: newtonite
      POSTGRES_PASSWORD: newtonite_dev_only
      POSTGRES_DB: newtonite
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newtonite -d newtonite"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
